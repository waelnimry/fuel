<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<meta name="description" content="Food, gym and body tracking for the cut.">
<title>Fuel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Same palette and type as the brother's "Fuel": warm near-black, amber accent, serif headings, mono labels. */
:root{
  --bg:#16120e; --card:#211b15; --card2:#2a231b; --ink:#f6efe6; --muted:#b3a593; --line:#3a3026;
  --accent:#f4a53a; --accent-ink:#1f1404; --good:#8fd16a; --bad:#e8836a; --note-bg:#2a2416;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:700 30px/1.15 var(--display);margin:8px 0 16px;text-wrap:balance}
h2{font:700 21px/1.25 var(--display);margin:0 0 8px;text-wrap:balance}
h3{font:600 15px/1.3 var(--sans);margin:0}
p{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.card.hi{border-color:var(--accent);background:linear-gradient(180deg,#2a2015,var(--card))}
.label{font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font:600 15px var(--sans);cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font:600 12px var(--mono);padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted)}
.pill.ok{background:#22301a;color:var(--good)}
.pill.warn{background:#3a2a14;color:var(--accent)}
.tick{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.tick:first-of-type{border-top:0}
.box{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent-ink)}
.tick.on .box{background:var(--accent);border-color:var(--accent)}
.tick.on .t{color:var(--muted)}
.t{font-weight:600}
.kc{font:13px var(--mono);color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.counter{font:600 13px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:2px 0}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0}
.ex .head{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input[type=number],input[type=date],input[type=text]{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:16px var(--sans);min-height:42px;width:100%}
.sets input{width:58px;text-align:center;padding:8px 4px}
.kg{width:86px!important}
.note{background:var(--note-bg);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font:700 34px/1 var(--display)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#14100c;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 15px var(--sans);padding:14px 0 16px;cursor:pointer;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:-1px;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;display:none;max-width:90vw}
.svgchart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<nav class="tabs" id="tabs">
  <button data-tab="today">Today</button>
  <button data-tab="eat">Eat</button>
  <button data-tab="shop">Shop</button>
  <button data-tab="body">Body</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
